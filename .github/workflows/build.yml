name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: keystore
        run: |
          if [ ! -f ks.jks ]; then
            keytool -genkeypair -keystore "$PWD/ks.jks" -storepass avalaval -keypass avalaval \
              -alias aval -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android, OU=Android, O=Android, L=Android, S=Android, C=US"
          fi
      - name: build release
        run: |
          gradle assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$PWD/ks.jks" \
            -Pandroid.injected.signing.store.password=avalaval \
            -Pandroid.injected.signing.key.alias=aval \
            -Pandroid.injected.signing.key.password=avalaval
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: ks.jks
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/*.apk